<html lang="ko">

<style>

@keyframes draw{to{stroke-dashoffset:0}}@keyframes stamp{from{opacity:0;transform:scale(.65) rotate(-7deg)}to{opacity:1;transform:scale(1) rotate(0)}}.film-card.dragging{z-index:90;cursor:grabbing;transition:none;filter:brightness(1.06);box-shadow:0 38px 65px #090e1d66}.film-card.target{z-index:5;outline:3px solid #fff2d7;outline-offset:-8px;filter:brightness(1.15)}.swap-label{z-index:12;pointer-events:none;position:absolute;left:50%;top:44%;transform:translate(-50%,6px);background:#f8f5df;color:var(--ink);font-size:10px;font-weight:800;white-space:nowrap;padding:9px 12px;opacity:0;transition:opacity .18s,transform .18s}.film-card.target .swap-label{opacity:1;transform:translate(-50%,0)}.film-card.in-flight{pointer-events:none;cursor:default;transition:none;box-shadow:0 23px 45px #0b132a35}.placeholder{border:1px dashed #57687533;background:#fff2}

.overlay{position:fixed;z-index:600;inset:0;display:grid;place-items:center;padding:20px}.backdrop{position:absolute;inset:0;background:#081524bf;backdrop-filter:blur(7px)}.dialog{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);width:min(800px,calc(100vw - 40px));max-height:calc(100vh - 40px);overflow:auto;background:#f7f7f2;box-shadow:0 35px 80px #0004;border-radius:3px;transform-origin:top left}.dialog-art{position:relative;min-height:465px;overflow:hidden;background:#334c61;color:white}.dialog-art:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0008,transparent 55%);pointer-events:none}.dialog-art-label{position:absolute;z-index:3;bottom:24px;left:22px;font-size:11px;letter-spacing:.08em;line-height:1.7;font-weight:700}.dialog-info{display:flex;flex-direction:column;padding:43px clamp(24px,3vw,42px) 25px}.close{position:absolute;z-index:6;right:14px;top:14px;background:#f5f5f0eb;border:1px solid #adb3b7;width:33px;height:33px;font-size:20px;display:grid;place-items:center;color:var(--ink)}.detail-index{font-size:10px;font-weight:800;color:var(--blue);letter-spacing:.06em;margin:0 0 13px}.detail-title{font-size:clamp(25px,3vw,42px);letter-spacing:-.065em;line-height:1.2;margin:0 0 22px;word-break:keep-all}.facts{display:grid;grid-template-columns:52px 1fr;column-gap:10px;row-gap:9px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}.facts dt{font-size:10px;color:var(--muted)}.facts dd{margin:0;font-weight:680}.choose-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:23px 0 10px}.choose-head strong{font-size:12px}.choose-head span{font-size:10px;color:var(--muted)}.tier-buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.tier-button{border:1px solid #c2c6c6;background:transparent;min-width:0;min-height:72px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:3px;transition:background .18s,border-color .18s,color .18s}.tier-button:hover{background:#e6e8f5;border-color:var(--blue)}.tier-button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.tier-button strong{font:italic 400 29px Georgia,serif}.tier-button span{font-size:9px;white-space:nowrap}.subrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}.clear{color:var(--muted);font-size:11px;border:0;background:transparent;padding:6px 0;text-decoration:underline;text-underline-offset:3px}.current-tier{color:var(--muted);font-size:10px}.order-tools{margin-top:auto;padding-top:19px}.order-tools p{color:var(--muted);font-size:10px;margin:0 0 8px}.order-tools>div{display:flex;gap:6px}.order-tools button{flex:1;background:transparent;color:var(--ink);border:1px solid #b6bdbd;padding:10px 6px;font-size:10px;font-weight:720}.order-tools button:hover:not(:disabled){color:var(--blue);border-color:var(--blue)}
@media(max-width:950px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.film-card,.placeholder{aspect-ratio:1.25}.hero-explain{width:220px}.tier-row{grid-template-columns:85px minmax(0,1fr)}.tier-contents .film-card,.tier-contents .placeholder{flex-basis:clamp(135px,20vw,185px);width:clamp(135px,20vw,185px)}}
@media(max-width:600px){.page{padding-top:16px}.topline{gap:7px;flex-wrap:wrap}.topnote{font-size:9px;letter-spacing:.02em}.counter{font-size:10px;gap:5px}.counter strong{font-size:18px}.hero{display:block;padding:24px 0 20px}h1{font-size:clamp(33px,10vw,53px)}.hero-explain{margin-top:13px;width:auto;flex-direction:row;align-items:center;gap:10px}.hero-explain:before{font-size:24px}.hero-explain p{font-size:11px}.toolbar{flex-direction:column;align-items:flex-start;gap:10px}.actions{justify-content:flex-start}.board{gap:8px}.film-card,.placeholder{aspect-ratio:.92}.card-head{top:9px;left:10px;right:10px}.card-num,.card-year{font-size:8px}.card-foot{bottom:10px;left:10px;right:10px}.card-title{font-size:clamp(13px,3.8vw,19px);margin-top:4px}.card-caption{font-size:7px}.card-director{display:none}.signature{top:27px;right:5px;transform:scale(.67)}.swap-label{font-size:9px}.result-title{display:block}.result-title p{text-align:left;margin-top:6px}.tier-row{grid-template-columns:60px minmax(0,1fr);min-height:110px}.tier-label strong{font-size:41px}.tier-label span{font-size:9px}.tier-contents{gap:7px;padding-left:8px}.tier-contents .film-card,.tier-contents .placeholder{flex-basis:calc((100% - 7px)/2);width:calc((100% - 7px)/2);aspect-ratio:1.36}.tier-contents .card-title{font-size:clamp(11px,2.8vw,15px)}.tier-contents .signature{transform:scale(.57);top:24px;right:2px}.dialog{display:block;width:min(430px,calc(100vw - 24px));max-height:calc(100vh - 26px)}.dialog-art{min-height:155px;height:155px}.dialog-art .art{height:240%;top:-68%}.dialog-art-label{left:17px;bottom:13px}.dialog-info{padding:18px 19px 20px}.detail-title{font-size:clamp(24px,6vw,34px);margin-bottom:12px}.detail-index{margin-bottom:9px}.facts{padding:12px 0;row-gap:6px}.choose-head{margin-top:14px}.tier-button{min-height:62px}.footer{flex-direction:column;gap:4px}}

/* 첫 화면 레이아웃 수정: 기존 카드 아트, hover, 상태 전환 스타일은 보존 */
.page {
  width: 100%;
  max-width: 1840px;
  height: 100svh;
  min-height: 0;
  padding: clamp(10px, 1.8svh, 20px) clamp(18px, 3vw, 48px) clamp(10px, 1.8svh, 20px);
  display: flex;
  flex-direction: column;
}
.topline {
  min-height: 48px;
  gap: 16px;
  padding-bottom: 9px;
}
.site-title {
  margin: 0;
  font-size: clamp(24px, 2.7vw, 40px);
  line-height: 1.18;
  font-weight: 800;
  letter-spacing: -.065em;
  white-space: nowrap;
}
.counter { flex: none; gap: 8px; font-size: 11px; }
.counter strong { font-size: 20px; }
.toolbar {
  min-height: 42px;
  padding: 5px 0;
  gap: 12px;
  border-top: 0;
}
.toolbar .mode { font-size: 11px; line-height: 1.4; }
.toolbar .actions { gap: 6px; }
.toolbar .action { min-height: 29px; padding: 5px 10px; font-size: 10px; }
.stage {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding-top: clamp(8px, 1.1svh, 12px);
}
.board {
  flex: 1 1 auto;
  min-height: 0;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: clamp(8px, .8vw, 13px);
}
.board > .film-card,
.board > .placeholder {
  height: 100%;
  aspect-ratio: auto;
}
.footer {
  flex: none;
  margin-top: 9px;
  padding-top: 7px;
  gap: 16px;
  font-size: 10px;
}
/* 결과 화면은 네 행이 늘어날 수 있도록 일반 문서 높이를 사용한다. */
.page:has(#results:not([hidden])) {
  height: auto;
  min-height: 100svh;
}
.page:has(#results:not([hidden])) .stage { flex: 1 0 auto; }
/* 태블릿과 모바일은 기존 2열 및 스크롤 방식을 유지한다. */
@media (max-width: 950px) {
  .page { height: auto; min-height: 100svh; display: block; }
  .topline { min-height: 0; padding-bottom: 12px; }
  .site-title { font-size: clamp(23px, 3.2vw, 31px); white-space: normal; }
  .stage { display: block; padding-top: 12px; }
  .board { height: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; gap: 9px; }
  .board > .film-card, .board > .placeholder { height: auto; aspect-ratio: 1.25; }
  .footer { margin-top: 14px; padding-top: 10px; }
}
@media (max-width: 600px) {
  .topline { align-items: flex-start; flex-wrap: nowrap; gap: 12px; }
  .site-title { font-size: clamp(23px, 5.9vw, 29px); line-height: 1.23; }
  .counter { margin-top: 4px; gap: 4px; font-size: 9px; }
  .counter strong { font-size: 17px; }
  .toolbar { gap: 9px; padding: 9px 0; }
  .board > .film-card, .board > .placeholder { aspect-ratio: .92; }
}
</style>
</head>
<body>
<div class="page" id="page">
<header>
 <div class="topline">
  <h1 class="site-title">다시 보고 싶은 영화 티어리스트</h1>
  <span class="counter" aria-live="polite">분류한 영화 <strong id="counter">0 / 8</strong></span>
 </div>
 <div class="toolbar"><span class="mode" id="modeText">카드를 선택해 재감상 등급을 지정해 보세요.</span><div class="actions"><button class="action main" id="showResult" hidden>결과 보기 ↗</button><button class="action main" id="backBoard" hidden>보드로 돌아가기 ↖</button><button class="action" id="replay" hidden>처음부터 다시 보기 ↻</button><button class="action main" id="skip" hidden>건너뛰기 →</button><button class="action minor" id="reset">전체 초기화</button></div></div>
</header>
<main id="stage" class="stage"><section class="board" id="board" aria-label="영화 카드 8장"></section><section id="results" hidden aria-label="재감상 티어리스트"><div class="result-title"><h2>나만의 다시 보기 지도.</h2><p>위에서 아래로 S, A, B, C. 같은 등급에 놓인 영화들 사이에는 별도의 순위가 없다.</p></div>
<div class="tier-row"><div class="tier-label"><strong>S</strong><span>매우 높음 <span data-count="S">0편</span></span></div><div class="tier-contents" id="slot-S"></div></div>
<div class="tier-row"><div class="tier-label"><strong>A</strong><span>높음 <span data-count="A">0편</span></span></div><div class="tier-contents" id="slot-A"></div></div>
<div class="tier-row"><div class="tier-label"><strong>B</strong><span>보통 <span data-count="B">0편</span></span></div><div class="tier-contents" id="slot-B"></div></div>
<div class="tier-row"><div class="tier-label"><strong>C</strong><span>낮음 <span data-count="C">0편</span></span></div><div class="tier-contents" id="slot-C"></div></div>
</section></main><footer class="footer"><span id="hint">카드 클릭: 영화 정보와 등급 선택 · 드래그: 카드 위치 교환</span><span><strong>영화 8편 / 등급 4개</strong> · 페이지를 닫으면 기록이 초기화된다.</span></footer>

}
async function choose(t){if(!selected||!editing())return;const id=selected,count=assigned(),old=tiers.get(id);tiers.set(id,t);updateCard(id,old!==t);updateUI();await closeDetail(false);
 if(count===7&&assigned()===8&&editing()){await nap(reduced.matches?0:240);if(assigned()===8&&editing())sortToResults()}
 else cards.get(id).focus({preventScroll:true});
}
function grouped(){const g={S:[],A:[],B:[],C:[]};order.forEach(id=>{const t=tiers.get(id);if(t)g[t].push(id)});return g}
function placeholder(){const e=document.createElement('div');e.className='placeholder';e.setAttribute('aria-hidden','true');return e;}
function slotsFor(destination){const slots=new Map();if(destination==='results'){const g=grouped();orderLevels.forEach(t=>{const el=$('#slot-'+t);el.replaceChildren();$(`[data-count="${t}"]`).textContent=`${g[t].length}편`;if(g[t].length===0){const msg=document.createElement('span');msg.className='empty-row';msg.textContent='아직 이 등급에 놓인 영화가 없다.';el.append(msg)}g[t].forEach(id=>{const x=placeholder();el.append(x);slots.set(id,x)})});board.hidden=true;results.hidden=false}
 else{board.replaceChildren();order.forEach(id=>{const x=placeholder();board.append(x);slots.set(id,x)});results.hidden=true;board.hidden=false}
 return slots;
}
function unstyle(card){card.classList.remove('in-flight');for(const prop of ['position','left','top','width','height','aspectRatio','margin','zIndex','transform','transformOrigin'])card.style[prop]=''}
function stopAnimations(){animations.forEach(a=>{try{a.cancel()}catch(_){}});animations=[]}
function place(slots){order.forEach(id=>{const c=cards.get(id);unstyle(c);slots.get(id)?.replaceWith(c)})}
function immediate(destination){stopAnimations();cards.forEach(c=>{c.getAnimations().forEach(a=>a.cancel());unstyle(c);c.classList.remove('no-mark','dragging','target')});place(slotsFor(destination))}
async function layout(destination,token=null){if(destination==='results'&&assigned()!==8)return;
 const run=token===null?++generation:token;stopAnimations();const initial=positions(order);setMode(destination==='results'?(token!==null?'replaying':'sorting'):'sorting');
 order.forEach(id=>{const card=cards.get(id),r=initial.get(id);card.getAnimations().forEach(a=>a.cancel());resetDepth(card);flight.append(card);card.classList.add('in-flight');Object.assign(card.style,{position:'fixed',left:`${r.left}px`,top:`${r.top}px`,width:`${r.width}px`,height:`${r.height}px`,aspectRatio:'auto',margin:'0',zIndex:'1',transformOrigin:'top left'});});
 const slots=slotsFor(destination),tasks=[],duration=reduced.matches?0:(destination==='results'?820:620);
 if(duration){order.forEach((id,index)=>{const card=cards.get(id),start=initial.get(id),end=slots.get(id).getBoundingClientRect(),dx=end.left-start.left,dy=end.top-start.top,sx=end.width/start.width,sy=end.height/start.height;
 const a=card.animate([{transform:'translate3d(0,0,0) scale(1,1)',opacity:1},{transform:`translate3d(${dx}px,${dy}px,0) scale(${sx},${sy})`,opacity:1}],{duration,delay:index*(destination==='results'?40:23),easing:'cubic-bezier(.22,.9,.19,1)',fill:'forwards'});animations.push(a);tasks.push(a.finished.catch(()=>{}));});}
 await Promise.all(tasks);
 if(run!==generation)return;
 // The transition animations use fill:'forwards'. A finished animation still
 // applies its final scale/translation until explicitly cancelled. Remove
 // that effect before restoring each card to its normal grid/flex layout.
 stopAnimations();
 place(slots);
 setMode(destination==='results'?'completed-list':assigned()?'editing-board':'unassigned-board');
 if(destination==='results')$('#backBoard').focus({preventScroll:true});
}
function sortToResults(){if(!editing()||assigned()!==8)return;return layout('results')}
function backToBoard(){if(mode!=='completed-list')return;return layout('board')}
function finishImmediately(){++generation;stopAnimations();immediate('results');setMode('completed-list');$('#backBoard').focus({preventScroll:true});}
async function replay(){if(mode!=='completed-list'||assigned()!==8)return;const run=++generation;stopAnimations();immediate('board');cards.forEach(card=>card.classList.add('no-mark'));setMode('replaying');
 if(!reduced.matches){const tasks=order.map((id,i)=>{const a=cards.get(id).animate([{opacity:0,transform:'translateY(22px) scale(.97)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:500,delay:i*60,easing:'cubic-bezier(.22,1,.36,1)'});animations.push(a);return a.finished.catch(()=>{})});await Promise.all(tasks);animations=[];}
 if(run!==generation)return;
 for(const id of order){const card=cards.get(id);card.classList.remove('no-mark');stamp(card);await nap(reduced.matches?0:130);if(run!==generation)return;}
 await nap(reduced.matches?0:250);if(run!==generation)return;await layout('results',run);
}
function reset(){if(!window.confirm('여덟 편의 등급과 카드 배치를 모두 초기화할까요?'))return;
 ++generation;stopAnimations();if(selected){selected=null;overlay.hidden=true;$('#page').inert=false}drag=null;if(target){target.classList.remove('target');target=null}order=FILMS.map(f=>f.id);FILMS.forEach(f=>{tiers.set(f.id,null);updateCard(f.id)});immediate('board');setMode('unassigned-board');$('#reset').focus({preventScroll:true});
}
function resize(){if(mode==='sorting'||mode==='replaying')finishImmediately();if(drag){drag.card.style.transform='';drag.card.classList.remove('dragging');drag=null;if(target){target.classList.remove('target');target=null}}}
$('#close').addEventListener('click',()=>closeDetail());$('#backdrop').addEventListener('click',()=>closeDetail());$$('.tier-button').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.tier)));$('#clearTier').addEventListener('click',()=>choose(null));
$('#showResult').addEventListener('click',sortToResults);$('#backBoard').addEventListener('click',backToBoard);$('#replay').addEventListener('click',replay);$('#skip').addEventListener('click',finishImmediately);$('#reset').addEventListener('click',reset);
for(const [name,step] of [['#previous',-1],['#next',1]]){$(name).addEventListener('click',async()=>{if(!selected)return;const id=selected,neighbor=order[order.indexOf(id)+step];await closeDetail(false);if(neighbor){swap(id,neighbor);cards.get(id).focus({preventScroll:true})}})}
document.addEventListener('keydown',e=>{if(selected){if(e.key==='Escape'){e.preventDefault();closeDetail();return}if(e.key==='Tab'){const buttons=$$('button:not([disabled])',dialog),first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}else if(e.key==='Escape'&&mode==='replaying'){e.preventDefault();finishImmediately()}});
window.addEventListener('resize',resize,{passive:true});
build();updateUI();
})();
</script>
</body>
