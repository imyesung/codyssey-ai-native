<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="890" viewBox="0 0 1000 890" role="img" aria-labelledby="title desc">
  <title id="title">영화 티어리스트 개선 사항</title>
  <desc id="desc">영화와 등급 저장, 좁은 화면 잘림, 미분류 칸의 카드 정렬을 각각 확인한 사항, 기준, 제안 순서로 연결한 흑백 도식. 카드 정렬은 기획서에 정렬 순서에 관한 조건이 없는 사용성 개선 제안이다.</desc>
  <defs>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #000; }
      .heading { font-size: 32px; font-weight: 700; }
      .column { font-size: 24px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .number { font-size: 21px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .issue { font-size: 27px; font-weight: 700; }
      .body { font-size: 23px; font-weight: 400; }
      .tag { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .emphasis { font-weight: 700; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #000; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1 1 L5 4 L1 7" fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="890" fill="#fff"/>
  <text x="40" y="60" class="heading">영화 티어리스트 개선 사항</text>

  <rect x="40" y="91" width="280" height="50" fill="#000"/>
  <rect x="360" y="91" width="280" height="50" fill="#000"/>
  <rect x="680" y="91" width="280" height="50" fill="#000"/>
  <text x="180" y="124" class="column">확인한 사항</text>
  <text x="500" y="124" class="column">기준</text>
  <text x="820" y="124" class="column">제안</text>

  <g aria-label="첫 번째 문제: 영화와 등급 저장">
    <rect x="40" y="161" width="42" height="32" fill="#000"/>
    <text x="61" y="185" class="number">1</text>
    <text x="96" y="186" class="issue">영화와 등급 저장</text>
    <rect x="40" y="204" width="280" height="150" class="box"/>
    <rect x="360" y="204" width="280" height="150" class="box"/>
    <rect x="680" y="204" width="280" height="150" class="box"/>
    <path d="M328 279 H352" class="arrow"/>
    <path d="M648 279 H672" class="arrow"/>
    <text x="60" y="250" class="body">
      <tspan x="60">같은 브라우저에서</tspan>
      <tspan x="60" dy="34">같은 파일을 다시 열면</tspan>
      <tspan x="60" dy="34" class="emphasis">미분류로 돌아감</tspan>
    </text>
    <text x="380" y="267" class="body">
      <tspan x="380">다시 열어도</tspan>
      <tspan x="380" dy="34">영화와 등급 유지</tspan>
    </text>
    <text x="700" y="267" class="body">
      <tspan x="700">영화와 등급 저장</tspan>
      <tspan x="700" dy="34">다시 열 때 복원</tspan>
    </text>
  </g>

  <g aria-label="두 번째 문제: 좁은 화면 잘림">
    <rect x="40" y="399" width="42" height="32" fill="#000"/>
    <text x="61" y="423" class="number">2</text>
    <text x="96" y="424" class="issue">좁은 화면 잘림</text>
    <rect x="40" y="442" width="280" height="150" class="box"/>
    <rect x="360" y="442" width="280" height="150" class="box"/>
    <rect x="680" y="442" width="280" height="150" class="box"/>
    <path d="M328 517 H352" class="arrow"/>
    <path d="M648 517 H672" class="arrow"/>
    <text x="60" y="505" class="body">
      <tspan x="60">창 폭을 좁히면</tspan>
      <tspan x="60" dy="34" class="emphasis">화면 오른쪽이 잘림</tspan>
    </text>
    <text x="380" y="505" class="body">
      <tspan x="380">좁은 화면에서도</tspan>
      <tspan x="380" dy="34">잘림 없이 내용 표시</tspan>
    </text>
    <text x="700" y="505" class="body">
      <tspan x="700">창 폭에 맞춰</tspan>
      <tspan x="700" dy="34">내용 재배치</tspan>
    </text>
  </g>

  <g aria-label="세 번째 항목: 미분류 칸의 카드 정렬, 사용성 개선 제안">
    <rect x="40" y="637" width="42" height="32" fill="#000"/>
    <text x="61" y="661" class="number">3</text>
    <text x="96" y="662" class="issue">미분류 칸의 카드 정렬</text>
    <rect x="770" y="637" width="190" height="32" class="box"/>
    <text x="865" y="661" class="tag">사용성 개선</text>
    <rect x="40" y="680" width="280" height="170" class="box"/>
    <rect x="360" y="680" width="280" height="170" class="box" stroke-dasharray="6 5"/>
    <rect x="680" y="680" width="280" height="170" class="box"/>
    <path d="M328 765 H352" class="arrow"/>
    <path d="M648 765 H672" class="arrow"/>
    <text x="60" y="736" class="body">
      <tspan x="60">등급 칸 → 미분류 칸</tspan>
      <tspan x="60" dy="34">놓은 위치와 무관하게</tspan>
      <tspan x="60" dy="34" class="emphasis">처음 순서로 돌아감</tspan>
    </text>
    <text x="380" y="736" class="body">
      <tspan x="380">기획서에</tspan>
      <tspan x="380" dy="34">정렬 순서에 관한</tspan>
      <tspan x="380" dy="34" class="emphasis">조건 없음</tspan>
    </text>
    <text x="700" y="753" class="body">
      <tspan x="700">미분류 칸에서도</tspan>
      <tspan x="700" dy="34">놓은 순서 유지</tspan>
    </text>
  </g>
</svg>
